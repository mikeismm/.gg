<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mike's page</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  /* ===== EASY-EDIT COLORS ===== */
  :root {
    --page-bg: #bfe3f7;
    --box-bg: #ffffff;
    --box-text: #111111;
    --header-bg: #e0699b;
    --header-text: #ffffff;
    --link: #1a4fd6;
    --border: #7a3b4f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--page-bg);
    color: var(--box-text);
    font-family: Verdana, Geneva, sans-serif;
    font-size: 13px;
  }
  a { color: var(--link); }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 14px;
    align-items: start;
  }

  .box {
    background: var(--box-bg);
    border: 2px solid var(--border);
    margin-bottom: 14px;
  }
  .box h2 {
    margin: 0;
    padding: 5px 10px;
    background: var(--header-bg);
    color: var(--header-text);
    font-size: 14px;
  }
  .box .inner { padding: 10px; }


  /* ===== SKY BACKGROUND ===== */
  html { background: var(--page-bg); }
  body {
    padding-top: 80px;
    min-height: 100vh;
    background: linear-gradient(#a9d8f2 0%, #d9ecf8 45%, #fde3ee 100%) fixed;
  }
  .box { box-shadow: 4px 4px 0 rgba(122,59,79,.35); }

  .petal {
    position: fixed; top: -20px; z-index: 2; pointer-events: none;
    background: #f8b4cf; box-shadow: inset -1px -1px 0 #e0699b;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0,-20px) rotate(0deg); }
    50%  { transform: translate(40px,50vh) rotate(180deg); }
    100% { transform: translate(-10px,105vh) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }

  /* ===== LEFT COLUMN ===== */
  .name { font-size: 20px; font-weight: bold; margin: 0 0 8px; }
  .pic {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ddd;
    border: 1px solid #999;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    overflow: hidden;
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .mood, .status { margin: 8px 0 0; }
  .info { width: 100%; border-collapse: collapse; }
  .info td { padding: 3px 4px; vertical-align: top; }
  .info td:first-child { font-weight: bold; width: 40%; }

  /* ===== RIGHT COLUMN ===== */
  .about p { margin: 0 0 8px; line-height: 1.5; }

  .friends {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    text-align: center;
  }
  .friend .thumb {
    aspect-ratio: 1 / 1;
    background: #ddd;
    border: 1px solid #999;
  }
  .friend span { display: block; margin-top: 3px; font-size: 11px; }

  .comment {
    display: flex;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px dashed #aaa;
  }
  .comment:last-child { border-bottom: 0; }
  .comment .thumb { width: 48px; height: 48px; background: #ddd; border: 1px solid #999; flex: none; overflow: hidden; }
  .comment .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .comment b { display: block; }

  @media (max-width: 700px) {
    .wrap { grid-template-columns: 1fr; }
    .friends { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
